<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Andrés Tejada, páginas web y agentes de IA" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1224"/><stop offset="1" stop-color="#1a2063"/></linearGradient>
<linearGradient id="y" x1="0" x2="1"><stop offset="0" stop-color="#ffc93c"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="c"><rect width="1000" height="280" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.o1{animation:m1 9s ease-in-out infinite alternate}
.o2{animation:m2 11s ease-in-out infinite alternate}
.o3{animation:m3 7s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(260px,40px)}}
@keyframes m2{to{transform:translate(-300px,-30px)}}
@keyframes m3{to{transform:translate(-120px,60px)}}
.t{animation:in 1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.u{stroke-dasharray:330;stroke-dashoffset:330;animation:dr 1.2s .8s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.r{opacity:0;animation:sh 12s infinite both}
@keyframes sh{0%{opacity:0;transform:translateY(14px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-10px)}}
.f{animation:fl 3s ease-in-out infinite alternate}
.f2{animation:fl 4s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translateY(-14px) rotate(8deg)}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="280" fill="url(#g)"/>
<g filter="url(#b)">
<circle class="o1" cx="120" cy="80" r="90" fill="#2a44f5" opacity=".7"/>
<circle class="o2" cx="860" cy="210" r="100" fill="#ffc93c" opacity=".35"/>
<circle class="o3" cx="600" cy="60" r="70" fill="#25d366" opacity=".25"/>
</g>
<g class="f" style="transform-origin:880px 70px"><rect x="850" y="40" width="56" height="56" rx="14" fill="none" stroke="#ffc93c" stroke-width="3"/></g>
<g class="f2" style="transform-origin:800px 200px"><circle cx="800" cy="200" r="22" fill="none" stroke="#25d366" stroke-width="3"/></g>
<text class="t" x="60" y="120" font-size="68" font-weight="800" fill="#f1efe8">Andrés Tejada</text>
<path class="u" d="M62 138 H392" stroke="url(#y)" stroke-width="6" stroke-linecap="round"/>
<text class="r" style="animation-delay:0s" x="60" y="190" font-size="30" fill="#f1efe8">Páginas web a la medida</text><text class="r" style="animation-delay:3s" x="60" y="190" font-size="30" fill="#f1efe8">Agentes de IA para WhatsApp</text><text class="r" style="animation-delay:6s" x="60" y="190" font-size="30" fill="#f1efe8">Landing pages que traen clientes</text><text class="r" style="animation-delay:9s" x="60" y="190" font-size="30" fill="#f1efe8">Chats que agendan citas por ti</text>
<text x="60" y="244" font-size="16" fill="#a3a8c4">Desarrollador front-end · Colombia</text>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>