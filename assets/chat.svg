<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-label="Ejemplo de un agente de IA atendiendo a un cliente por chat" xmlns:c2pa="http://c2pa.org/manifest">
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}@keyframes k0{0%,3.9%{opacity:0;transform:translateY(14px) scale(.92)}6%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes k1{0%,18.9%{opacity:0;transform:translateY(14px) scale(.92)}21%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes d1{0%,10.65%{opacity:0}10.75%,18.6%{opacity:1}19%,100%{opacity:0}}@keyframes k2{0%,33.9%{opacity:0;transform:translateY(14px) scale(.92)}36%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes k3{0%,48.9%{opacity:0;transform:translateY(14px) scale(.92)}51%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes d3{0%,40.65%{opacity:0}40.75%,48.6%{opacity:1}49%,100%{opacity:0}}@keyframes k4{0%,63.9%{opacity:0;transform:translateY(14px) scale(.92)}66%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes k5{0%,78.9%{opacity:0;transform:translateY(14px) scale(.92)}81%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes d5{0%,70.65%{opacity:0}70.75%,78.6%{opacity:1}79%,100%{opacity:0}}
.dt{animation:bn 1s infinite}@keyframes bn{40%{transform:translateY(-5px)}}
