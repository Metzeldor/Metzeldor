<line x1="20" x2="500" y1="70" y2="70" stroke="#2a2f52"/>
<g style="animation:k0 16s infinite both;transform-box:fill-box;transform-origin:center"><rect x="133" y="84" width="363" height="36" rx="16" fill="#2a44f5"/><text x="148" y="107" font-size="14" fill="#fff">Hola, ¿tienen torta de chocolate para mañana?</text></g><g style="animation:k1 16s infinite both;transform-box:fill-box;transform-origin:center"><rect x="24" y="130" width="348" height="36" rx="16" fill="#262c58"/><text x="39" y="153" font-size="14" fill="#fff">¡Hola! Sí, tenemos. ¿Para cuántas personas?</text></g><g style="animation:d1 16s infinite both"><rect x="24" y="130" width="64" height="36" rx="16" fill="#262c58"/><circle class="dt" style="animation-delay:0.0s" cx="42" cy="148" r="4" fill="#a3a8c4"/><circle class="dt" style="animation-delay:0.15s" cx="56" cy="148" r="4" fill="#a3a8c4"/><circle class="dt" style="animation-delay:0.3s" cx="70" cy="148" r="4" fill="#a3a8c4"/></g><g style="animation:k2 16s infinite both;transform-box:fill-box;transform-origin:center"><rect x="304" y="176" width="192" height="36" rx="16" fill="#2a44f5"/><text x="319" y="199" font-size="14" fill="#fff">Para 10, a las 4 p. m.</text></g><g style="animation:k3 16s infinite both;transform-box:fill-box;transform-origin:center"><rect x="24" y="222" width="392" height="36" rx="16" fill="#262c58"/><text x="39" y="245" font-size="14" fill="#fff">Listo. Son $85.000. ¿La recoges o te la llevamos?</text></g><g style="animation:d3 16s infinite both"><rect x="24" y="222" width="64" height="36" rx="16" fill="#262c58"/><circle class="dt" style="animation-delay:0.0s" cx="42" cy="240" r="4" fill="#a3a8c4"/><circle class="dt" style="animation-delay:0.15s" cx="56" cy="240" r="4" fill="#a3a8c4"/><circle class="dt" style="animation-delay:0.3s" cx="70" cy="240" r="4" fill="#a3a8c4"/></g><g style="animation:k4 16s infinite both;transform-box:fill-box;transform-origin:center"><rect x="400" y="268" width="96" height="36" rx="16" fill="#2a44f5"/><text x="415" y="291" font-size="14" fill="#fff">La recojo</text></g><g style="animation:k5 16s infinite both;transform-box:fill-box;transform-origin:center"><rect x="24" y="314" width="400" height="36" rx="16" fill="#262c58"/><text x="39" y="337" font-size="14" fill="#fff">Quedó agendada para mañana a las 4 p. m. ¡Gracias!</text></g><g style="animation:d5 16s infinite both"><rect x="24" y="314" width="64" height="36" rx="16" fill="#262c58"/><circle class="dt" style="animation-delay:0.0s" cx="42" cy="332" r="4" fill="#a3a8c4"/><circle class="dt" style="animation-delay:0.15s" cx="56" cy="332" r="4" fill="#a3a8c4"/><circle class="dt" style="animation-delay:0.3s" cx="70" cy="332" r="4" fill="#a3a8c4"/></g>
