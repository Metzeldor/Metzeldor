<rect x="6" y="6" width="508" height="368" rx="30" fill="#181c36" stroke="#2a2f52" stroke-width="2"/>
<circle cx="44" cy="42" r="18" fill="#2a44f5"/><text x="44" y="47" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">IA</text>
